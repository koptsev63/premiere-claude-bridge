name: Publish to MCP Registry

# Runs when a release is published (or by hand for an existing release).
# Takes the .mcpb attached to the release, writes its sha256 into server.json
# (scripts/server-json.mjs) and publishes the card. Login is GitHub OIDC:
# no token or password is stored anywhere.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to publish (e.g. 0.8.2)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required by mcp-publisher OIDC trust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VER="${{ inputs.version }}"
          if [ -z "$VER" ]; then VER="${{ github.event.release.tag_name }}"; VER="${VER#v}"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Download the release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p dl
          gh release download "v$VER" --repo "${{ github.repository }}" --pattern "premiere-claude-bridge-$VER.mcpb" --dir dl

      - name: Write server.json from the bundle
        run: |
          VER="${{ steps.ver.outputs.version }}"
          node scripts/server-json.mjs "$VER" "dl/premiere-claude-bridge-$VER.mcpb"
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --version

      - name: Validate
        run: mcp-publisher validate

      - name: Authenticate (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: mcp-publisher publish
